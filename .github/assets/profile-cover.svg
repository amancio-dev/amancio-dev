<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">André Amancio — Desenvolvimento Back-end — PHP, Laravel e MySQL — Estágio e Jovem Aprendiz</title>
  <desc id="desc">Identidade visual de André Amancio em azul escuro, ciano e violeta, com formas de circuitos. Animações decorativas suaves nos circuitos, ilustrações e bordas; texto fixo. O movimento é desativado conforme a preferência de acessibilidade do sistema.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111e" /><stop offset="1" stop-color="#10182b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64e9ff" /><stop offset="1" stop-color="#9583ff" />
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#64e9ff" stop-opacity=".13" /><stop offset="1" stop-color="#64e9ff" stop-opacity="0" /></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9eb2d2" stroke-opacity=".07" stroke-width="1" /></pattern>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.2" result="blur" in="SourceGraphic" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter><linearGradient id="shine-band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64e9ff" stop-opacity="0" /><stop offset=".45" stop-color="#64e9ff" stop-opacity=".04" /><stop offset=".5" stop-color="#d1f8ff" stop-opacity=".28" /><stop offset=".55" stop-color="#9583ff" stop-opacity=".07" /><stop offset="1" stop-color="#9583ff" stop-opacity="0" /></linearGradient><clipPath id="art-shine-clip" clipPathUnits="userSpaceOnUse"><rect x="915" y="75" width="206" height="162" rx="10" /></clipPath></defs>
  <style type="text/css">/* Decorative motion only. Every text element remains static. */
.float-art{animation:float-art 5.8s ease-in-out infinite;}
.art-glow{animation:float-art 5.8s ease-in-out infinite,art-glow 5.8s ease-in-out infinite;}
.ambient-halo{animation:ambient-halo 7.2s ease-in-out infinite;}
.ring-glow{animation:ring-glow 6.4s ease-in-out infinite;}
.orbit-flow{animation:orbit-flow 7.5s linear infinite;}
.circuit-flow{animation:circuit-flow 4.4s linear infinite;}
.edge-flow{animation:edge-flow 7.8s linear infinite;}
.shine-sweep{animation:shine-sweep 7.4s ease-in-out infinite;}
@keyframes float-art{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes art-glow{0%,100%{opacity:.18}50%{opacity:.45}}
@keyframes ambient-halo{0%,100%{opacity:.58}50%{opacity:1}}
@keyframes ring-glow{0%,100%{stroke-opacity:.1}50%{stroke-opacity:.26}}
@keyframes orbit-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-104}}
@keyframes circuit-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-146}}
@keyframes edge-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-3032.81}}
@keyframes shine-sweep{0%,12%{transform:translateX(0);opacity:0}25%{opacity:.65}65%{opacity:.65}88%,100%{transform:translateX(310px);opacity:0}}
.route-one{animation:route-one 5.4s linear 0s infinite;}
@keyframes route-one{0%{transform:translate(0px,0px);opacity:0}8%{transform:translate(12px,0px);opacity:.9}32%{transform:translate(46px,0px);opacity:.9}58%{transform:translate(70px,24px);opacity:.9}91%{transform:translate(119px,24px);opacity:.9}100%{transform:translate(132px,24px);opacity:0}}
.route-two{animation:route-two 6.3s linear -2.8s infinite;}
@keyframes route-two{0%{transform:translate(0px,0px);opacity:0}8%{transform:translate(13px,0px);opacity:.9}32%{transform:translate(50px,0px);opacity:.9}58%{transform:translate(76px,-26px);opacity:.9}91%{transform:translate(136px,-26px);opacity:.9}100%{transform:translate(148px,-26px);opacity:0}}

@media (prefers-reduced-motion: reduce){
  .motion{animation:none !important;transform:none !important;}
  .travel-dot,.shine-sweep{display:none;}
  .circuit-flow,.edge-flow{stroke-dasharray:none;opacity:.2;}
  .art-glow{opacity:.18;}
  .ambient-halo{opacity:1;}
}
</style><rect width="1200" height="340" rx="22" fill="url(#base)" />
