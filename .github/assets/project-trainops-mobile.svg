</g><path d="M476 159h37l12 12h43" fill="none" stroke="#64e9ff" stroke-opacity=".25" stroke-width="1.3" />
    <circle cx="568" cy="171" r="2.5" fill="#9583ff" /><path d="M476 159h37l12 12h43" fill="none" stroke="url(#accent)" stroke-opacity=".75" stroke-width="2" class="motion circuit-flow" stroke-dasharray="15 58" filter="url(#soft-glow)" />
    <circle cx="476" cy="159" r="3" fill="#cbfaff" opacity=".82" filter="url(#soft-glow)" class="motion travel-dot route-one" /><g clip-path="url(#art-shine-clip)"><rect x="424" y="66" width="48" height="84" fill="url(#shine-band)" opacity="0" class="motion shine-sweep" /></g><rect x="1.5" y="1.5" width="597" height="237" rx="20.5" fill="none" stroke="url(#accent)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="160 1472.81" opacity=".55" class="motion edge-flow" /></svg>