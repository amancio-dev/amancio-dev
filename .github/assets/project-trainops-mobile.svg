</g><g class="motion float-art" style="--float-height: 3px"><rect x="479" y="71" width="89" height="75" rx="12" fill="#101d31" stroke="url(#accent)" stroke-width="1.4" />
    <path d="M480 89h87" stroke="#64e9ff" stroke-opacity=".25" />
