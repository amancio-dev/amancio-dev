<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">TrainOps — Treinamentos e orçamento</title>
  <desc id="desc">Versão móvel da identidade visual de André Amancio, com texto ampliado e detalhes em ciano e violeta sobre azul escuro. Animações decorativas suaves nos circuitos, ilustrações e bordas; texto fixo. O movimento é desativado conforme a preferência de acessibilidade do sistema.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111e" /><stop offset="1" stop-color="#10182b" /></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64e9ff" /><stop offset="1" stop-color="#9583ff" /></linearGradient>
    <radialGradient id="halo"><stop stop-color="#64e9ff" stop-opacity=".09" /><stop offset="1" stop-color="#64e9ff" stop-opacity="0" /></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9eb2d2" stroke-opacity=".045" stroke-width="1" /></pattern>
  <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.2" result="blur" in="SourceGraphic" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter><linearGradient id="shine-band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64e9ff" stop-opacity="0" /><stop offset=".45" stop-color="#64e9ff" stop-opacity=".04" /><stop offset=".5" stop-color="#d1f8ff" stop-opacity=".28" /><stop offset=".55" stop-color="#9583ff" stop-opacity=".07" /><stop offset="1" stop-color="#9583ff" stop-opacity="0" /></linearGradient><clipPath id="art-shine-clip" clipPathUnits="userSpaceOnUse"><rect x="476" y="66" width="96" height="84" rx="10" /></clipPath></defs>
  <style type="text/css">/* Decorative motion only. Every text element remains static. */
.float-art{animation:float-art 5.8s ease-in-out infinite;}
.art-glow{animation:float-art 5.8s ease-in-out infinite,art-glow 5.8s ease-in-out infinite;}
.ambient-halo{animation:ambient-halo 7.2s ease-in-out infinite;}
.ring-glow{animation:ring-glow 6.4s ease-in-out infinite;}
.orbit-flow{animation:orbit-flow 7.5s linear infinite;}
.circuit-flow{animation:circuit-flow 4.4s linear infinite;}
.edge-flow{animation:edge-flow 7.8s linear infinite;}
.shine-sweep{animation:shine-sweep 7.4s ease-in-out infinite;}
@keyframes float-art{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes art-glow{0%,100%{opacity:.18}50%{opacity:.45}}
@keyframes ambient-halo{0%,100%{opacity:.58}50%{opacity:1}}
@keyframes ring-glow{0%,100%{stroke-opacity:.1}50%{stroke-opacity:.26}}
@keyframes orbit-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-104}}
@keyframes circuit-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-146}}
@keyframes edge-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-1632.81}}
@keyframes shine-sweep{0%,12%{transform:translateX(0);opacity:0}25%{opacity:.65}65%{opacity:.65}88%,100%{transform:translateX(200px);opacity:0}}
.route-one{animation:route-one 4.8s linear 0s infinite;}
@keyframes route-one{0%{transform:translate(0px,0px);opacity:0}8%{transform:translate(6px,0px);opacity:.9}37%{transform:translate(37px,0px);opacity:.9}61%{transform:translate(49px,12px);opacity:.9}91%{transform:translate(82px,12px);opacity:.9}100%{transform:translate(92px,12px);opacity:0}}

@media (prefers-reduced-motion: reduce){
  .motion{animation:none !important;transform:none !important;}
  .travel-dot,.shine-sweep{display:none;}
  .circuit-flow,.edge-flow{stroke-dasharray:none;opacity:.2;}
  .art-glow{opacity:.18;}
  .ambient-halo{opacity:1;}
}
</style><rect width="600" height="240" rx="22" fill="url(#base)" />
  <rect x=".5" y=".5" width="599" height="239" rx="21.5" fill="none" stroke="#28344d" />
  <rect x="348" y="1" width="251" height="238" rx="21" fill="url(#grid)" />
  <ellipse cx="550" cy="148.8" rx="210" ry="190" fill="url(#halo)" class="motion ambient-halo" />
  <path d="M17 29V211" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" />
  <rect x="38" y="23" width="94" height="27" rx="13.5" fill="#18243a" stroke="url(#accent)" stroke-opacity=".3" /><text x="85" y="42" fill="#aebed6" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.2">PROJETO</text><text x="35" y="111" fill="#f6f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.4">TrainOps</text><text x="38" y="160" fill="#c9d5e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" letter-spacing="-.15">Treinamentos</text><text x="38" y="196" fill="#c9d5e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" letter-spacing="-.15">e orçamento</text><rect x="38" y="217" width="57" height="3" rx="1.5" fill="url(#accent)" /><text x="559" y="220" fill="#8195b4" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="end" letter-spacing="2">01</text><circle cx="524" cy="108" r="57" fill="none" stroke="#64e9ff" stroke-opacity=".1" class="motion ring-glow" />
